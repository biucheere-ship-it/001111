<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kai App Kup</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fffdfb;--surf:#fff;--ink:#2e1b14;--mut:#8a746a;--line:#efe6df;--brown:#733b2c;--o:#f39c12;--p:#f78fb0;--b:#0e84c6;--g:#6fba74;--sh:0 1px 2px #3b221410,0 8px 24px -8px #3b221422;--r:14px;--spot:#f39c1220}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c120e;--surf:#271913;--ink:#f6ebe4;--mut:#b49c90;--line:#3a2820;--sh:0 1px 2px #0006,0 10px 28px -10px #000a;--spot:#f78fb022}}
:root[data-theme="dark"]{--bg:#1c120e;--surf:#271913;--ink:#f6ebe4;--mut:#b49c90;--line:#3a2820;--sh:0 1px 2px #0006,0 10px 28px -10px #000a;--spot:#f78fb022}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.6 'IBM Plex Sans Thai','Noto Sans Thai',system-ui,sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.glow{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(520px 380px at 50% -40px,#f39c1226,transparent 70%),radial-gradient(360px 300px at 100% 40%,#f78fb018,transparent 70%),radial-gradient(360px 300px at 0% 75%,#0e84c614,transparent 70%);animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(0,14px,0);opacity:.75}}
main{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:40px 20px 72px}
.hero{text-align:center;position:relative;padding-bottom:6px}
.logo{position:relative;width:128px;height:128px;margin:0 auto;border-radius:50%;overflow:hidden;box-shadow:0 0 0 1px var(--line),0 18px 40px -14px #733b2c66,0 4px 10px #733b2c22}
.logo img{width:100%;height:100%;display:block}
.logo::after{content:"";position:absolute;inset:-20% -60%;background:linear-gradient(105deg,transparent 42%,#ffffffcc 50%,transparent 58%);transform:translateX(-100%);animation:sheen 5.5s ease-in-out infinite 1.2s}
@keyframes sheen{0%{transform:translateX(-100%)}30%,100%{transform:translateX(100%)}}
.stars i{position:absolute;width:var(--s);height:var(--s);background:var(--c);clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);animation:tw 3.2s ease-in-out infinite;opacity:0;filter:drop-shadow(0 0 4px var(--c))}
@keyframes tw{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:.95;transform:scale(1) rotate(45deg)}}
h1{font-size:26px;font-weight:600;letter-spacing:.01em;margin:22px 0 2px}
.sub{margin:0;color:var(--mut);font-size:15px;font-weight:300}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:26px 0 22px}
.btn{position:relative;overflow:hidden;font:inherit;color:inherit;cursor:pointer;text-decoration:none;transition:transform .18s,box-shadow .18s,border-color .18s;outline:0}
.btn:focus-visible{box-shadow:0 0 0 3px #f39c1255}
.btn:active{transform:scale(.97)}
.chip{padding:7px 16px;border-radius:99px;border:1px solid var(--line);background:var(--surf);font-size:14px;font-weight:500;box-shadow:var(--sh)}
.chip:hover{border-color:var(--o);transform:translateY(-1px)}
.cta{display:block;width:100%;border:0;border-radius:var(--r);padding:16px;font-size:17px;font-weight:500;color:#fff;background:linear-gradient(135deg,#8a4a38,#673325);box-shadow:0 14px 28px -12px #733b2caa,inset 0 1px 0 #ffffff33}
.cta::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,#ffffff55 50%,transparent 60%);transform:translateX(-120%);animation:sheen2 4.8s ease-in-out infinite 2s}
@keyframes sheen2{0%{transform:translateX(-120%)}35%,100%{transform:translateX(120%)}}
.cta:hover{transform:translateY(-2px);box-shadow:0 18px 32px -12px #733b2cbb,inset 0 1px 0 #ffffff33}
.rip{position:absolute;border-radius:50%;background:#ffffff66;transform:scale(0);animation:rip .6s ease-out;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
.back{border:0;background:none;color:var(--mut);padding:6px 0;font-size:14px}.back:hover{color:var(--ink)}
h2{font-size:20px;font-weight:600;margin:6px 0 14px}
.list{background:var(--surf);border-radius:var(--r);box-shadow:var(--sh);border:1px solid var(--line);overflow:hidden}
.row{--mx:50%;--my:50%;position:relative;display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;border:0;border-top:1px solid var(--line);background:radial-gradient(160px circle at var(--mx) var(--my),var(--spot),transparent 70%),transparent;text-align:left;font:inherit;color:inherit;animation:in .4s both}
.row:first-child{border-top:0}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
button.row{cursor:pointer;transition:background-color .2s}button.row:hover{background-color:#f39c120a}
.dot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor}
.nm{flex:1;font-weight:500}.no{width:22px;color:var(--mut);font-size:13px;font-variant-numeric:tabular-nums}
.pr{font-weight:600;font-variant-numeric:tabular-nums}
.st{font-size:12px;color:var(--g);display:flex;align-items:center;gap:6px;min-width:76px;justify-content:flex-end}.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.out{color:var(--p)}.row.off .nm,.row.off .pr{opacity:.45}
.chev{color:var(--mut);font-size:20px;line-height:1}
.empty{padding:28px;text-align:center;color:var(--mut);font-size:14px}
footer{text-align:center;margin-top:44px;font-size:12px}footer a{color:var(--mut);cursor:pointer;margin:0 10px}footer a:hover{color:var(--ink)}
input,select{font:inherit;font-size:14px;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--surf);color:var(--ink);min-width:0;outline:0}
input:focus,select:focus{border-color:var(--o);box-shadow:0 0 0 3px #f39c1230}
.ad{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px;border-top:1px solid var(--line)}.ad:first-child{border-top:0}.ad input{flex:1 1 110px}
.x{border:0;background:none;color:var(--p);cursor:pointer;font:inherit;font-size:13px;padding:0 6px}
.tabs{display:flex;gap:22px;justify-content:center;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{border:0;background:none;font:inherit;font-size:14px;padding:10px 2px;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs .on{color:var(--ink);font-weight:600;border-color:var(--o)}
.line-btn{margin-top:14px;border:1px dashed var(--line);background:none;border-radius:10px;padding:9px 14px;font-size:14px;color:var(--mut)}.line-btn:hover{border-color:var(--o);color:var(--ink)}
.save{margin-top:20px}
#ld{position:fixed;inset:0;z-index:9;background:var(--bg);display:none;place-items:center}#ld.on{display:grid}
.track{width:min(300px,80vw);height:60px;position:relative;overflow:hidden;border-bottom:2px dashed var(--line)}
.cat-run{position:absolute;bottom:3px;animation:run 1.6s linear infinite}
.cat-run svg{width:76px;height:auto;display:block;animation:bob .22s ease-in-out infinite alternate;overflow:visible}
.lg{stroke:#733b2c;stroke-width:5;stroke-linecap:round;transform-box:fill-box;transform-origin:50% 0;animation:sw .22s ease-in-out infinite alternate}.lg.b{animation-direction:alternate-reverse;opacity:.75}
.tl{transform-box:fill-box;transform-origin:0 100%;animation:wag .3s ease-in-out infinite alternate}
@keyframes sw{from{transform:rotate(-32deg)}to{transform:rotate(32deg)}}@keyframes wag{from{transform:rotate(-14deg)}to{transform:rotate(12deg)}}
@keyframes run{from{left:-90px}to{left:100%}}@keyframes bob{to{transform:translateY(-4px)}}
#ld p{color:var(--mut);text-align:center;font-size:14px;margin-top:10px}
dialog{border:0;border-radius:18px;background:var(--surf);color:var(--ink);padding:24px;max-width:340px;width:90%;box-shadow:0 30px 60px -20px #0008}dialog::backdrop{background:#2e1b1488;backdrop-filter:blur(3px)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.stars i{opacity:.7}}
</style></head><body>

<div id="app"></div>
<footer><a onclick="tgl()" id="sn">🔊</a><a onclick="adminEntry()" id="fa">แอดมิน</a></footer>
</main>
<dialog id="dlg"><h2 style="margin-top:0">เข้าสู่ระบบแอดมิน</h2>
<div style="display:grid;gap:10px"><input id="u" placeholder="ยูสเซอร์" autocomplete="username"><input id="p" type="password" placeholder="รหัสผ่าน" autocomplete="current-password"></div>
<p id="er" style="color:var(--p);font-size:13px;min-height:20px;margin:10px 0"></p>
<div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn chip" onclick="dlg.close()">ยกเลิก</button><button class="btn chip" style="background:var(--brown);color:#fff;border-color:var(--brown)" onclick="login()">เข้าสู่ระบบ</button></div></dialog>
<script type="application/json" id="state">{"contacts":[{"id":"c1","label":"LINE","url":"https://line.me/"},{"id":"c2","label":"Facebook","url":"https://facebook.com/"},{"id":"xo3yf55","label":"ใหม่","url":"https://"}],"cats":[{"id":"k1","name":"เกมมือถือ"},{"id":"k2","name":"Steam"},{"id":"k3","name":"บัตรเติมเงิน"}],"items":[{"id":"i1","name":"ตัวอย่างสินค้า A","price":"99","cat":"k1","ok":true},{"id":"i2","name":"ตัวอย่างสินค้า B","price":"199","cat":"k1","ok":false},{"id":"i3","name":"ตัวอย่างสินค้า C","price":"350","cat":"k2","ok":true}]}</script>
<script>
const $=s=>document.querySelector(s),dlg=$('#dlg');
// ===== ตั้งค่า: วาง URL ของ Web App จาก Google Apps Script ตรงนี้ =====
const API='https://script.google.com/macros/s/AKfycbyJOir0mObJhYZ2iSSiyhLkNCUbxqxp7zxt3P1MOMP7-wJAth1znl-qclxn_l-fwlxiXg/exec';
let TOKEN='',S=JSON.parse($('#state').textContent),cur=null,adm=false,tab='contacts',dirty=false,AC=null,mute=false;
const call=async b=>(await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(b)})).json();
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>'x'+Math.random().toString(36).slice(2,8),ld=on=>$('#ld').classList.toggle('on',on),COL=['#f39c12','#f78fb0','#0e84c6','#6fba74'];
function pop(){if(mute)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type='sine';o.frequency.setValueAtTime(520,n);o.frequency.exponentialRampToValueAtTime(980,n+.09);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.16,n+.01);g.gain.exponentialRampToValueAtTime(.0001,n+.16);o.connect(g).connect(AC.destination);o.start(n);o.stop(n+.18)}catch(e){}}
function tgl(){mute=!mute;$('#sn').textContent=mute?'🔇':'🔊'}
document.addEventListener('pointerdown',e=>{if(e.target.closest('.btn,.row,.tabs button,#fa,#sn,.x'))pop();const b=e.target.closest('.btn');if(!b)return;const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height)/3,d=document.createElement('span');d.className='rip';d.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;b.appendChild(d);setTimeout(()=>d.remove(),600)});
document.addEventListener('pointermove',e=>{const r=e.target.closest?.('.row');if(!r)return;const b=r.getBoundingClientRect();r.style.setProperty('--mx',e.clientX-b.left+'px');r.style.setProperty('--my',e.clientY-b.top+'px')});
const safeUrl=u=>/^https?:\/\//i.test(u)?u:'#';
function render(){const a=$('#app');$('#fa').textContent=adm?'ออกจากแอดมิน':'แอดมิน';if(adm)return a.innerHTML=adminHTML();
 let h='';
 if(cur===null)h='<div class="chips">'+S.contacts.map(c=>`<a class="btn chip" target="_blank" rel="noopener" href="${esc(safeUrl(c.url))}">${esc(c.label)}</a>`).join('')+'</div><button class="btn cta" onclick="cur=\'\';render()">เมนูสินค้า</button>';
 else if(cur==='')h='<button class="back" onclick="cur=null;render()">‹ กลับ</button><h2>เลือกหมวดหมู่</h2><div class="list">'+(S.cats.map((c,n)=>`<button class="row" style="animation-delay:${n*45}ms" onclick="cur='${esc(c.id)}';render()"><span class="dot" style="color:${COL[n%4]};background:${COL[n%4]}"></span><span class="nm">${esc(c.name)}</span><span class="chev">›</span></button>`).join('')||'<div class="empty">ยังไม่มีหมวดหมู่</div>')+'</div>';
 else{const c=S.cats.find(x=>x.id===cur),L=S.items.filter(i=>i.cat===cur);
  h=`<button class="back" onclick="cur='';render()">‹ หมวดหมู่</button><h2>${esc(c?.name)}</h2><div class="list">`+(L.map((i,n)=>`<div class="row ${i.ok?'':'off'}" style="animation-delay:${n*45}ms"><span class="no">${n+1}</span><span class="nm">${esc(i.name)}</span><span class="pr">฿${esc(i.price)}</span><span class="st ${i.ok?'':'out'}">${i.ok?'พร้อมขาย':'สินค้าหมด'}</span></div>`).join('')||'<div class="empty">ยังไม่มีสินค้าในหมวดนี้</div>')+'</div>'}
 a.innerHTML=h}
function adminHTML(){const T=[['contacts','ช่องทางติดต่อ'],['cats','หมวดหมู่'],['items','สินค้า']],add=(k,l)=>`<button class="btn line-btn" onclick="addNew('${k}')">+ ${l}</button>`;
 let h='<div class="tabs">'+T.map(t=>`<button class="${tab===t[0]?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('')+'</div><div class="list">';
 if(tab==='contacts')h+=S.contacts.map(c=>`<div class="ad"><input value="${esc(c.label)}" onchange="ed('contacts','${c.id}','label',this.value)"><input value="${esc(c.url)}" onchange="ed('contacts','${c.id}','url',this.value)"><button class="x" onclick="del('contacts','${c.id}')">ลบ</button></div>`).join('');
 if(tab==='cats')h+=S.cats.map(c=>`<div class="ad"><input value="${esc(c.name)}" onchange="ed('cats','${c.id}','name',this.value)"><button class="x" onclick="del('cats','${c.id}')">ลบ</button></div>`).join('');
 if(tab==='items')h+=S.items.map(i=>`<div class="ad"><input value="${esc(i.name)}" onchange="ed('items','${i.id}','name',this.value)"><input style="max-width:80px;flex:0 1 80px" value="${esc(i.price)}" onchange="ed('items','${i.id}','price',this.value)"><select onchange="ed('items','${i.id}','cat',this.value)">${S.cats.map(c=>`<option value="${c.id}" ${c.id===i.cat?'selected':''}>${esc(c.name)}</option>`).join('')}</select><select onchange="ed('items','${i.id}','ok',this.value==='1')"><option value="1" ${i.ok?'selected':''}>พร้อมขาย</option><option value="0" ${i.ok?'':'selected'}>สินค้าหมด</option></select><button class="x" onclick="del('items','${i.id}')">ลบ</button></div>`).join('');
 h+='</div>'+add(tab,{contacts:'เพิ่มช่องทาง',cats:'เพิ่มหมวดหมู่',items:'เพิ่มสินค้า'}[tab]);
 return h+`<button class="btn cta save" onclick="save()">บันทึกลงชีต${dirty?' •':''}</button>`}
function ed(k,id,f,v){S[k].find(x=>x.id===id)[f]=v;dirty=true}
function addNew(k){const o={contacts:{label:'ใหม่',url:'https://'},cats:{name:'หมวดใหม่'},items:{name:'สินค้าใหม่',price:'0',cat:S.cats[0]?.id||'',ok:true}}[k];S[k].push({id:uid(),...o});dirty=true;render()}
function del(k,id){if(!confirm('ลบรายการนี้?'))return;S[k]=S[k].filter(x=>x.id!==id);if(k==='cats')S.items=S.items.filter(i=>i.cat!==id);dirty=true;render()}
function adminEntry(){if(adm){adm=false;render()}else{$('#er').textContent='';dlg.showModal()}}
async function login(){$('#er').textContent='กำลังตรวจสอบ...';try{const r=await call({action:'login',user:$('#u').value,pass:$('#p').value});if(r.ok){TOKEN=r.token;adm=true;dlg.close();$('#p').value='';render()}else $('#er').textContent='ยูสเซอร์หรือรหัสผ่านไม่ถูกต้อง'}catch(e){$('#er').textContent='เชื่อมต่อชีตไม่ได้ ตรวจสอบ URL ของ Web App'}}
async function save(){ld(true);try{const r=await call({action:'save',token:TOKEN,data:{contacts:S.contacts,cats:S.cats,items:S.items}});if(!r.ok)throw new Error(r.error==='auth'?'หมดเวลาล็อกอิน กรุณาเข้าสู่ระบบใหม่':'บันทึกไม่สำเร็จ');dirty=false;alert('บันทึกลงชีตแล้ว')}catch(e){alert(e.message||e)}ld(false);render()}
async function load(){try{const r=await (await fetch(API)).json();if(r.cats){S.contacts=r.contacts.map(c=>({...c,id:String(c.id)}));S.cats=r.cats.map(c=>({...c,id:String(c.id)}));S.items=r.items.map(i=>({...i,id:String(i.id),cat:String(i.cat),price:String(i.price),ok:i.ok===true||String(i.ok).toUpperCase()==='TRUE'}))}}catch(e){}ld(false);render()}
(()=>{const P=[[8,10,14],[88,6,10],[2,58,9],[96,52,12],[20,92,8],[80,88,10],[50,-6,8]];P.forEach((p,n)=>{const e=document.createElement('i');e.style.cssText=`left:${p[0]}%;top:${p[1]}%;--s:${p[2]}px;--c:${COL[n%4]};animation-delay:${n*.55}s;animation-duration:${2.6+n%3}s`;$('#stars').appendChild(e)})})();
render();API.startsWith('http')?load():setTimeout(()=>ld(false),1100);
</script></body></html>
